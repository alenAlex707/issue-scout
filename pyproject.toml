[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "issue-scout"
version = "0.1.0"
description = "Find and rank approachable GitHub issues from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Silvren" }]
keywords = ["github", "issues", "open-source", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
issue-scout = "issue_scout.cli:main"

[project.urls]
Homepage = "https://github.com/Silvren/issue-scout"
Repository = "https://github.com/Silvren/issue-scout"
Issues = "https://github.com/Silvren/issue-scout/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_scout"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
